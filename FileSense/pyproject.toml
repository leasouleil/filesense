[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filesense"
version = "0.1.0"
description = "AI-powered file categorization and organization tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # move the contents of your existing requirements.txt here,
    # or keep requirements.txt and drop this dependencies list
]

[project.scripts]
filesense = "filesense.main:main"

[tool.setuptools.packages.find]
include = ["filesense*"]
